services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"           # Paper optimiza el rendimiento (alternativas: VANILLA, FABRIC)
      VERSION: "26.2"         # Alternativamente se puede indicar "LATEST"
      MEMORY: "4G"            # Asignación de memoria RAM
      ONLINE_MODE: "FALSE"    # Permite la conexión sin cuenta de Microsoft
      ENABLE_RCON: "true"
      RCON_PASSWORD: "TuPasswordSeguro"
    volumes:
      - ./data:/data
    tty: true
    stdin_open: true