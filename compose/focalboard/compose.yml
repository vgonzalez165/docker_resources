version: '3.8'

services:
  focalboard:
    image: mattermost/focalboard:latest
    container_name: focalboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FB_DBTYPE=postgres
      - FB_DBCONNSTR=postgres://focalboard_user:focalboard_password@focalboard-db:5432/focalboard_db?sslmode=disable
    volumes:
      - focalboard-data:/opt/focalboard/data
    depends_on:
      focalboard-db:
        condition: service_healthy

  focalboard-db:
    image: postgres:16-alpine
    container_name: focalboard-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=focalboard_user
      - POSTGRES_PASSWORD=focalboard_password
      - POSTGRES_DB=focalboard_db
    volumes:
      - focalboard-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focalboard_user -d focalboard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  focalboard-data:
  focalboard-db-data:
