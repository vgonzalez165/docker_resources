services:
  nifi:
    image: apache/nifi:1.28.1
    container_name: nifi
    hostname: nifi
    restart: unless-stopped
    ports:
      - "8443:8443" # Interfaz web HTTPS: https://localhost:8443/nifi
      - "9999:9999" # Puerto para prácticas de streaming por red (ListenTCP / ListenSyslog)
    environment:
      # Credenciales (mínimo 12 caracteres en password)
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=admin12345678
      # Ajuste de RAM para convivir con los otros composes
      - NIFI_JVM_HEAP_INIT=1g
      - NIFI_JVM_HEAP_MAX=2g
      - NIFI_WEB_HTTPS_PORT=8443
      # Fuerza a NiFi a usar el usuario "root" o "hadoop" al hablar con HDFS si no tiene Kerberos
      - HADOOP_USER_NAME=root
    volumes:
      - ./hadoop-conf:/opt/nifi/nifi-current/hadoop-conf:ro
      - ./drivers:/opt/nifi/nifi-current/drivers:ro
      - ./logs-input:/opt/nifi/nifi-current/logs-input
      # Persistencia de los flujos que diseñéis en el lienzo
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
    networks:
      - shared-network

volumes:
  nifi_conf:
  nifi_state:

networks:
  shared-network:
    external: true