version: '3.8'

services:
  kanboard:
    image: kanboard/kanboard:latest
    container_name: kanboard
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - kanboard-data:/var/www/app/data
      - kanboard-plugins:/var/www/app/plugins
      - kanboard-ssl:/var/www/app/ssl

volumes:
  kanboard-data:
  kanboard-plugins:
  kanboard-ssl:
